[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anisama"
version = "1.0.3"
description = "A CLI tool to browse, watch, and download anime from Anime-Sama (VOSTFR/VF)"
authors = [
    {name = "6sfy"}
]
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["anime", "cli", "anime-sama", "streaming", "downloader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "rapidfuzz>=3.0.0",
    "questionary>=2.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "requests>=2.31.0",
]

[project.urls]
Repository = "https://github.com/6sfy/anisama"

[project.scripts]
anisama = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
